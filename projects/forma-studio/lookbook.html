<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lookbook — FORMA Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="nav">
      <div class="wrap">
        <a class="logo" href="./">FORMA</a>
        <nav class="nav-links">
          <a href="./shop.html">Shop</a>
          <a href="./lookbook.html">Lookbook</a>
        </nav>
        <a class="bag" href="./shop.html#checkout" data-bag>Bag (0)</a>
      </div>
    </header>

    <section class="section">
      <div class="wrap">
        <h2>Spring rooms</h2>
        <p class="story">Product storytelling as editorial — rooms first, SKUs second. Shot in a Shoreditch townhouse.</p>
        <div class="lookbook" style="margin-top: 32px;">
          <img src="https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&w=1400&q=80" alt="Living room set" />
          <img src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1400&q=80" alt="Dining light" />
          <img src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1400&q=80" alt="Bedroom textiles" />
          <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1400&q=80" alt="Exterior approach" />
        </div>
      </div>
    </section>

    <section class="pdp wrap">
      <img src="https://images.unsplash.com/photo-1507473883500-ef54e3e1e4e0?auto=format&fit=crop&w=1200&q=80" alt="Arc lamp detail" />
      <div>
        <p style="letter-spacing:0.16em;text-transform:uppercase;font-size:0.72rem;color:var(--muted);margin-bottom:10px;">Featured</p>
        <h1>Arc Lamp</h1>
        <p class="price">£420</p>
        <p class="story">Brushed steel, linen shade, dimmable. Designed to sit in the corner you actually use.</p>
        <div class="swatches" aria-label="Finishes">
          <button type="button" style="background:#c9b8a0" aria-label="Sand"></button>
          <button type="button" style="background:#2b2b2b" aria-label="Ink"></button>
          <button type="button" style="background:#8a6a4a" aria-label="Umber"></button>
        </div>
        <button class="btn" type="button" data-add="Arc Lamp">Add to bag</button>
      </div>
    </section>

    <div class="toast" role="status"></div>
    <footer class="footer">
      <div class="wrap">
        <span>© 2025 FORMA Studio.</span>
        <a href="/">A Northern Digital project</a>
      </div>
    </footer>
    <script src="./app.js"></script>
  </body>
</html>
