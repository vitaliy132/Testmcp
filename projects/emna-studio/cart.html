<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart | emnastudio</title>
    <link
      rel="icon"
      href="https://static.wixstatic.com/media/a22769_ac6a8f03c7ee4dac91bc2bfa11b1d1bd%7Emv2.jpg/v1/fill/w_192%2Ch_192%2Clg_1%2Cusm_0.66_1.00_0.01/a22769_ac6a8f03c7ee4dac91bc2bfa11b1d1bd%7Emv2.jpg"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="cart">
    <div data-chrome></div>
    <main class="page">
      <div class="wrap">
        <h1 class="page-title">Cart</h1>
        <div class="cart-table" data-cart-body></div>
        <div class="cart-total">
          <span>Subtotal</span>
          <strong data-cart-total>₺0</strong>
        </div>
        <p class="lede">Shipping: <span data-ship>Calculated at checkout</span>. Free over 4000 TL.</p>
        <button type="button" class="btn solid" data-checkout>Checkout</button>
        <p data-checkout-note style="margin-top: 12px; color: var(--blue)"></p>
      </div>
    </main>
    <div data-footer></div>
    <script src="./catalog.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
