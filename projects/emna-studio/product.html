<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product | emnastudio</title>
    <link
      rel="icon"
      href="https://static.wixstatic.com/media/a22769_ac6a8f03c7ee4dac91bc2bfa11b1d1bd%7Emv2.jpg/v1/fill/w_192%2Ch_192%2Clg_1%2Cusm_0.66_1.00_0.01/a22769_ac6a8f03c7ee4dac91bc2bfa11b1d1bd%7Emv2.jpg"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="product">
    <div data-chrome></div>
    <main class="page">
      <div class="wrap pdp">
        <div class="gallery">
          <img data-gallery-main alt="" />
          <div class="thumbs" data-thumbs></div>
        </div>
        <div>
          <h1 data-p-title></h1>
          <p class="price" data-p-price></p>
          <div class="qty-row">
            <span>Quantity</span>
            <input type="number" min="1" value="1" data-p-qty />
          </div>
          <button type="button" class="btn solid" data-p-add>Add to cart</button>
          <div class="meta-block">
            <h3>Description</h3>
            <p data-p-desc></p>
            <h3>Size</h3>
            <p data-p-size></p>
            <h3>Material</h3>
            <p data-p-mat></p>
          </div>
        </div>
      </div>
      <section class="related wrap">
        <h2>Related products</h2>
        <div class="grid" data-related></div>
      </section>
    </main>
    <div data-footer></div>
    <script src="./catalog.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
