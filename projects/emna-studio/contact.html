<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emna Contact | Fethiye | emnastudio</title>
    <meta
      name="description"
      content="For any enquiries please feel free to get in touch with Emna Studio at info@emnastudio.com or +90 542 636 40 04"
    />
    <link
      rel="icon"
      href="https://static.wixstatic.com/media/a22769_ac6a8f03c7ee4dac91bc2bfa11b1d1bd%7Emv2.jpg/v1/fill/w_192%2Ch_192%2Clg_1%2Cusm_0.66_1.00_0.01/a22769_ac6a8f03c7ee4dac91bc2bfa11b1d1bd%7Emv2.jpg"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="contact">
    <div data-chrome></div>
    <main class="page">
      <div class="wrap contact-grid">
        <div>
          <h1 class="page-title">Start my project</h1>
          <p class="lede">If you have a project in mind, please complete the form below to send your inquiry.</p>
          <form class="form" data-contact>
            <div class="fields">
              <label>
                Name
                <input type="text" name="name" required />
              </label>
              <label>
                Email
                <input type="email" name="email" required />
              </label>
              <label>
                Service
                <select name="service" required>
                  <option value="">Select a service</option>
                  <option>Architectural Project</option>
                  <option>Interior Project</option>
                  <option>Consultancy</option>
                  <option>Furniture Design</option>
                  <option>Graphic Design</option>
                </select>
              </label>
              <label>
                Message
                <textarea name="message" required></textarea>
              </label>
              <button class="btn solid" type="submit">Submit</button>
            </div>
            <p class="ok">We are studying your request. We will get back to you within 24 hours.</p>
          </form>
        </div>
        <div>
          <iframe
            class="map"
            title="Emna Studio, Fethiye"
            src="https://maps.google.com/maps?q=Cumhuriyet%20mah.%20%C3%87ar%C5%9F%C4%B1%20Cd%20118%20Fethiye&t=&z=15&ie=UTF8&iwloc=&output=embed"
            loading="lazy"
          ></iframe>
          <p style="margin-top: 16px">
            <strong>EMNA STUDIO, Le Concept Store</strong><br />
            Cumhuriyet mah. Çarşı Cd nº118, 48300 Fethiye, Muğla, Türkiye
          </p>
          <p>
            <a
              href="https://www.google.com/maps/dir/?api=1&destination=Cumhuriyet%2C%20%C3%87ar%C5%9F%C4%B1%20Cd.%20No%3A118%2C%2048303%20Fethiye%2FMu%C4%9Fla"
              target="_blank"
              rel="noopener"
              >Directions</a
            >
          </p>
        </div>
      </div>
    </main>
    <div data-footer></div>
    <script src="./catalog.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
