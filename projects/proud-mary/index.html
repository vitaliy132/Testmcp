<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proud Mary Coffee – Proud Mary Coffee Melbourne</title>
    <link rel="icon" href="https://www.proudmarycoffee.com.au/cdn/shop/files/PM-FAVICON.png?v=1624952807" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="home">
    <div data-chrome></div>

    <section class="vault">
      <video
        class="vault-video"
        autoplay
        muted
        loop
        playsinline
        poster="https://www.proudmarycoffee.com.au/cdn/shop/files/preview_images/7f197418a9ae4d82897c4c32774f6e21.thumbnail.0000000000_2000x.jpg?v=1786402541"
      >
        <source
          src="https://www.proudmarycoffee.com.au/cdn/shop/videos/c/vp/7f197418a9ae4d82897c4c32774f6e21/7f197418a9ae4d82897c4c32774f6e21.HD-1080p-7.2Mbps-91264699.mp4?v=0"
          type="video/mp4"
        />
      </video>
      <div class="vault-overlay"></div>
      <div class="vault-content">
        <h2>DELUXE VAULT SALE</h2>
        <p>BUY 1 TIN, GET 1, 50% OFF</p>
        <a class="btn white" href="collection.html?id=deluxe-coffee">Shop Deluxe Vault</a>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2><a href="collection.html?id=coffee-subscriptions">COFFEE SUBSCRIPTIONS</a></h2>
      </div>
      <div class="rail-wrap">
        <button type="button" class="rail-btn prev" aria-label="Previous">‹</button>
        <div class="rail" data-rail="subscriptions"></div>
        <button type="button" class="rail-btn next" aria-label="Next">›</button>
      </div>
      <div class="center-cta">
        <a class="btn cyan" href="collection.html?id=coffee-subscriptions">Subscribe &amp; Save</a>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2><a href="collection.html?id=all-coffee-newest">NEW COFFEES</a></h2>
      </div>
      <div class="rail-wrap">
        <button type="button" class="rail-btn prev" aria-label="Previous">‹</button>
        <div class="rail" data-rail="newest"></div>
        <button type="button" class="rail-btn next" aria-label="Next">›</button>
      </div>
      <div class="center-cta">
        <a class="btn cyan" href="collection.html?id=coffee">See more</a>
      </div>
    </section>

    <section class="quotes">
      <button type="button" class="quote-arrow prev" data-quote-prev aria-label="Previous">
        <svg viewBox="0 0 59 95" aria-hidden="true"><polygon fill="#f3d250" points="0 50.5 58.91 95.12 58.91 77.61 20.75 50.5 58.91 23.39 58.91 5.88 0 50.5"/></svg>
      </button>
      <div class="quote-viewport">
        <div class="quote-track" data-quotes></div>
      </div>
      <button type="button" class="quote-arrow next" data-quote-next aria-label="Next">
        <svg viewBox="0 0 59 95" aria-hidden="true"><polygon fill="#f3d250" points="58.91 50.5 0 5.88 0 23.39 38.16 50.5 0 77.61 0 95.12 58.91 50.5"/></svg>
      </button>
    </section>

    <section class="section">
      <div class="section-head">
        <h2><a href="collection.html?id=pmc-merchandise">PROUD MARY MERCH</a></h2>
      </div>
      <div class="merch-grid" data-merch></div>
      <div class="center-cta">
        <a class="btn cyan" href="collection.html?id=pmc-merchandise">See more</a>
      </div>
    </section>

    <div data-footer></div>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
