<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product – Proud Mary Coffee Melbourne</title>
    <link rel="icon" href="https://www.proudmarycoffee.com.au/cdn/shop/files/PM-FAVICON.png?v=1624952807" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="product">
    <div data-chrome></div>
    <main class="page">
      <div class="pdp">
        <div class="gallery" data-gallery></div>
        <div>
          <h1 data-p-title></h1>
          <p class="price" data-p-price></p>
          <div data-p-opts></div>
          <div class="qty-row">
            <span>Qty</span>
            <input type="number" min="1" value="1" data-p-qty />
          </div>
          <button type="button" class="btn ink" data-p-add>Add to cart</button>
          <div class="desc" data-p-desc></div>
        </div>
      </div>
      <section class="related">
        <div class="section-head">
          <h2>You may also like</h2>
        </div>
        <div class="rail-wrap">
          <button type="button" class="rail-btn prev" aria-label="Previous">‹</button>
          <div class="rail" data-rail="related"></div>
          <button type="button" class="rail-btn next" aria-label="Next">›</button>
        </div>
      </section>
    </main>
    <div data-footer></div>
    <script src="./catalog.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
