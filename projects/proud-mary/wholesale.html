<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wholesale – Proud Mary Coffee Melbourne</title>
    <link rel="icon" href="https://www.proudmarycoffee.com.au/cdn/shop/files/PM-FAVICON.png?v=1624952807" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Poppins:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="wholesale">
    <div data-chrome></div>
    <main class="page">
      <h1>WHOLESALE</h1>
      <p class="lede">Monday – Friday 9am to 5pm. Proud Mary Wholesale supplies cafes, restaurants and retailers with specialty coffee roasted in Melbourne.</p>
      <p class="lede">This demo does not take wholesale applications. For the live programme visit the official Proud Mary wholesale page.</p>
      <form class="form" data-demo-form>
        <input name="name" placeholder="Cafe / business name" required />
        <input name="email" type="email" placeholder="Email" required />
        <textarea name="message" placeholder="Tell us about your venue" required></textarea>
        <button class="btn ink" type="submit">Enquire</button>
        <p class="note"></p>
      </form>
    </main>
    <div data-footer></div>
    <script src="./catalog.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
