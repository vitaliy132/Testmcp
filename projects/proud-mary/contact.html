<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us – Proud Mary Coffee Melbourne</title>
    <link rel="icon" href="https://www.proudmarycoffee.com.au/cdn/shop/files/PM-FAVICON.png?v=1624952807" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="contact">
    <div data-chrome></div>
    <main class="page">
      <h1>CONTACT US</h1>
      <p class="lede">Questions about coffee, brewing or delivery? Write to us. This demo does not send messages — the live team is at online@proudmarycoffee.com.au.</p>
      <h2 style="font-family:var(--display);margin:8px 0 12px">Join The SMS List</h2>
      <p class="lede">SMS subscribers hear first and receive exclusive offers.</p>
      <form class="form" data-demo-form>
        <input name="name" placeholder="Name" required />
        <input name="email" type="email" placeholder="Email" required />
        <input name="phone" placeholder="Mobile" />
        <textarea name="message" placeholder="Message"></textarea>
        <button class="btn yellow" type="submit">Join</button>
        <p class="note"></p>
      </form>
    </main>
    <div data-footer></div>
    <script src="./catalog.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
