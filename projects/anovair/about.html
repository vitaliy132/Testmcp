<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Anovair</title>
    <link rel="icon" href="https://anovair.com/cdn/shop/files/ANOVAIR_SYMBOL_f080dd14-ce0d-4720-875b-da64d471d0ff.png?crop=center&height=48&v=1723044699&width=48" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="about">
    <div data-chrome></div>
    <main class="page">
      <h1>About Anovair</h1>
      <p class="lede">The faces behind Anovair; we are Tim and Maurice, childhood friends and founders of the brand.</p>
      <div data-about></div>
      <img src="https://anovair.com/cdn/shop/files/Anovair_Web_Res_JdeWaart_18.11.24_728.jpg?v=1732564080&width=2100" alt="Anovair founders" style="width:100%; margin: 36px 0;" />
      <h2 style="font-family:var(--serif);font-size:2rem;font-weight:500;margin-bottom:12px">Contact us for business inquiries</h2>
      <p class="lede">We handle business inquiries exclusively. For collaborations, proposals or wholesale, use the form below.</p>
      <form class="form" data-demo-form>
        <input name="name" placeholder="Name" required />
        <input name="email" type="email" placeholder="Email" required />
        <textarea name="message" placeholder="Message" required></textarea>
        <button class="btn solid" type="submit">Send</button>
        <p class="note"></p>
      </form>
    </main>
    <div data-footer></div>
    <script type="module" src="./app.ts"></script>
  </body>
