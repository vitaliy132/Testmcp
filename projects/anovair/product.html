<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product — Anovair</title>
    <link rel="icon" href="https://anovair.com/cdn/shop/files/ANOVAIR_SYMBOL_f080dd14-ce0d-4720-875b-da64d471d0ff.png?crop=center&height=48&v=1723044699&width=48" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="product">
    <div data-chrome></div>
    <main class="page">
      <div class="pdp">
        <div class="gallery" data-gallery></div>
        <div>
          <h1 data-p-title></h1>
          <p class="price" data-p-price></p>
          <p class="lede">Size</p>
          <div class="sizes" data-p-sizes></div>
          <button type="button" class="add" data-p-add>Add to cart</button>
          <div class="desc" data-p-desc></div>
        </div>
      </div>
      <section class="related">
        <div class="section-head">
          <h2>You may also like</h2>
        </div>
        <div class="rail-wrap">
          <button type="button" class="rail-btn prev" aria-label="Previous">‹</button>
          <div class="rail" data-rail="related"></div>
          <button type="button" class="rail-btn next" aria-label="Next">›</button>
        </div>
      </section>
    </main>
    <div data-footer></div>
    <script src="./catalog.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
